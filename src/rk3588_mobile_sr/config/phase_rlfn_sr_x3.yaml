model:
  scale: 3
  in_channels: 3
  out_channels: 3
  num_channels: 32
  num_blocks: 4
  phase_factor: 2
  codec_feature_channels: 96
  codec_project_channels: 16
  codec_upsample_factor: 4
  negative_slope: 0.1

data:
  dataset_description: "data/OpenVidHD/openvidhd_60k64_frame_sequences.csv"
  video_root: "data/OpenVidHD"
  mlvc_repo: "third_party/mlvc"
  mlvc_checkpoint: "data/mlvc/mlvc-s-psnr-v1.ckpt"
  mlvc_variant: "small"
  sequence_frames: 8
  q_indices: [0, 21, 42, 63]
  val_fraction: 0.01
  val_samples: 16
  split_seed: 42
  lr_size: [360, 640]
  hr_size: [1080, 1920]
  colorspace: "yuv"
  augment: true
  num_workers: 4
  prefetch_batches: 1
  mlvc_amp: true
  codec_context: true
  codec_dropout: 0.25

training:
  batch_size: 2
  qat_batch_size: 1
  log_every: 500
  val_every: 1000
  save_every: 5000
  float_lr: 1.0e-3
  qat_lr: 1.0e-5
  float_patience: 10
  float_min_delta: 0.1
  float_min_evaluations: 12
  float_safety_max_steps: 100000
  observer_patience: 3
  observer_min_delta: 0.02
  observer_min_evaluations: 5
  observer_safety_max_steps: 15000
  qat_patience: 5
  qat_min_delta: 0.02
  qat_min_evaluations: 7
  qat_safety_max_steps: 30000
  clip_min: -1.0
  clip_max: 1.0
  ema_decay: 0.999
  backend: "qnnpack"
  val_metric: "vmaf"

deploy:
  target: "rk3576"
  input_h: 360
  input_w: 640
  onnx_output: "phase_rlfn_sr_x3.onnx"
  rknn_output: "phase_rlfn_sr_x3.rknn"
  calib_dir: "data/rknn_calib.txt"
  rknn_python: ".venv-rknn/bin/python"
  rknn_quantize: "kl_divergence"
  rknn_quantized_method: "channel"
  codec_context: true
