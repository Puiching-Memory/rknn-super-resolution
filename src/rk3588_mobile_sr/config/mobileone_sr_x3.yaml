model:
  scale: 3
  in_channels: 3
  out_channels: 3
  num_channels: 32
  num_blocks: 8
  num_conv_branches: 4
  negative_slope: 0.1

data:
  codec_manifest: "data/codec_cache/manifest.jsonl"
  val_manifest: "data/sources/manifests/val_fixed.jsonl"
  lr_size: [360, 640]
  hr_size: [1080, 1920]
  colorspace: "yuv"
  nv12_simulate: true
  augment: true
  decode: "auto"
  dali_num_threads: 4
  dali_initial_fill: 32
  prefetch_batches: 4

stage1:
  patch_size: 128
  batch_size: 16
  max_steps: 100000
  early_stop_patience: 10
  early_stop_min_delta: 0.01
  val_every: 1000
  lr: 1.0e-3
  loss: "l1"

stage2:
  patch_size: 160
  batch_size: 16
  max_steps: 80000
  val_every: 4000
  early_stop_patience: 8
  early_stop_min_delta: 0.005
  lr: 3.0e-5
  lambda_dct: 0.02
  lambda_dists: 0.05
  lambda_kd: 0.03
  teacher_arch: "mambairv2_light"
  teacher_weight: "checkpoints/teacher/mambairv2_lightSR_x3.pth"

stage3_qat:
  patch_size: 144
  batch_size: 1
  max_steps: 15000
  phase1_steps: 3000
  phase2_steps: 9000
  val_every: 1000
  lr: 1.0e-6
  clip_min: -1.0
  clip_max: 1.0
  ema_decay: 0.999
  bn_batches: 64
  backend: "qnnpack"

deploy:
  input_h: 360
  input_w: 640
  onnx_output: "mobileone_sr_x3.onnx"
  rknn_output: "mobileone_sr_x3.rknn"
  calib_dir: "data/rknn_calib.txt"
  rknn_python: ".venv-rknn/bin/python"
  rknn_quantize: "kl_divergence"
  rknn_quantized_method: "channel"
