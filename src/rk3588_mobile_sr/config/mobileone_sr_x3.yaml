model:
  scale: 3
  in_channels: 3
  out_channels: 3
  num_channels: 32
  num_blocks: 8
  num_conv_branches: 4

data:
  train_hr_dir: "data/DIV2K_train_HR"
  train_lr_dir: "data/DIV2K_train_LR_bicubic/X3"
  val_hr_dir: "data/DIV2K_valid_HR"
  val_lr_dir: "data/DIV2K_valid_LR_bicubic/X3"
  num_workers: 4

stage1:
  patch_size: 128
  batch_size: 16
  max_steps: 100000
  early_stop_patience: 10
  early_stop_min_delta: 0.01
  val_every: 1000
  lr: 1.0e-3
  loss: "l1"

stage2:
  patch_size: 160
  batch_size: 16
  max_steps: 80000
  val_every: 4000
  early_stop_patience: 8
  early_stop_min_delta: 0.005
  lr: 3.0e-5
  lambda_dct: 0.02
  lambda_kd: 0.03
  teacher_arch: "edsr"
  teacher_weight: "checkpoints/teacher/edsr_x3.pth"

stage3_qat:
  patch_size: 144
  batch_size: 1
  max_steps: 15000
  phase1_steps: 3000
  phase2_steps: 9000
  val_every: 1000
  lr: 1.0e-6
  clip_min: -1.0
  clip_max: 1.0
  ema_decay: 0.999
  bn_batches: 64
  backend: "qnnpack"

deploy:
  input_h: 360
  input_w: 640
  onnx_output: "mobileone_sr_x3.onnx"
  rknn_output: "mobileone_sr_x3.rknn"
  calib_dir: "data/rknn_calib.txt"
