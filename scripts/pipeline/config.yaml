# Snakemake data pipeline configuration (paths relative to repo / --directory root).
train_manifest: data/sources/manifests/train.jsonl
val_manifest: data/sources/manifests/val_fixed.jsonl
codec_cache_dir: data/codec_cache
mezzanine_dir: data/mezzanine
scaled_dir: data/scaled_cache

clips_per_video: 8
clip_frames: 24
gop: 16
image_gop: 1
codecs:
  - libx264
  - libx265
  - libsvtav1
bitrates_kbps:
  - 150
  - 200
  - 300
  - 500
  - 800
lr_height: 360
lr_width: 640
seed: 42
preset: veryfast
encode_pix_fmt: yuv420p
mezzanine_crf: 18
mezzanine_gop: 1
div2k_weight: 0.3
