# Snakemake data pipeline configuration (paths relative to repo / --directory root).
train_manifest: data/sources/manifests/train.jsonl
val_manifest: data/sources/manifests/val_fixed.jsonl
codec_cache_dir: data/codec_cache
hr_dir: data/hr_lossless      # per-clip lossless H.264 HR (replaces CRF18 mezzanine)

clips_per_video: 8
clip_frames: 24
# GOP sampled per (source, clip, codec) from weighted candidates, matching the
# short/long-GOP skew of real streamed video instead of a single fixed value.
gop_candidates: [30, 60, 120]
gop_weights: [0.4, 0.4, 0.2]
codecs:
  - libx264
  - libx265
  - libsvtav1
bitrates_kbps:
  - 150
  - 200
  - 300
  - 500
  - 800
lr_height: 360
lr_width: 640
seed: 42
preset: veryfast
