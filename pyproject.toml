[project]
name = "rk3588-mobile-sr"
version = "0.1.0"
description = "RK3576 frozen-MLVC video reconstruction and Phase-MobileOne 3x super-resolution"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "onnx>=1.17",
    "onnxscript>=0.7",
    "loguru>=0.7",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scikit-image>=0.21",
    "swanlab>=0.5.0",
    "torch>=2.12.0",
    "torchcodec>=0.16.0",
    "torchvision>=0.27.0",
    "traceml-ai>=0.3.1",
    "typer>=0.12.0",
    "einops>=0.8.0",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6.0",
    "pyiqa>=0.1.15.post2",
]

# RKNN conversion is typically done in a separate environment because
# rknn-toolkit2 pins torch<=2.4.0, which conflicts with this project's
# torch>=2.12.0 requirement. Install it manually there when needed.

[project.scripts]
rk3588-mobile-sr = "rk3588_mobile_sr.cli:main"
rk3588-train = "rk3588_mobile_sr.train.unified:main"
rk3588-export-onnx = "rk3588_mobile_sr.deploy.onnx:main"
rk3588-eval-psnr = "rk3588_mobile_sr.eval.psnr:evaluate_cli"
rk3588-convert-rknn = "rk3588_mobile_sr.deploy.rknn:main"
rk3588-relu-audit = "rk3588_mobile_sr.deploy.relu_audit:main"
rk3588-bench-rknn-activations = "rk3588_mobile_sr.deploy.act_fusion_bench:main"
rk3588-build-rknn-calibration = "rk3588_mobile_sr.dev.build_mlvc_calibration:main"
rk3588-generate-report-charts = "rk3588_mobile_sr.dev.generate_report_charts:main"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchcodec = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.extra-build-dependencies]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rk3588_mobile_sr"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    "checkpoints",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
    "N812",  # torchvision TF / torch.nn.functional F aliases
    "N817",  # DistributedDataParallel as DDP
]

[tool.ruff.lint.pydocstyle]
convention = "google"
