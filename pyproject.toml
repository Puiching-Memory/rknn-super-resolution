[project]
name = "rk3588-mobile-sr"
version = "0.1.0"
description = "RK3576 frozen-MLVC codec-aware Phase-RLFN 3x super-resolution"
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "MIT" }
dependencies = [
    "onnx==1.22.0",
    "onnxscript==0.7.1",
    "loguru==0.7.3",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "scikit-image==0.26.0",
    "swanlab==0.9.1",
    "torch==2.13.0+cu132",
    "torchcodec==0.16.0+cu132",
    "torchvision==0.28.0+cu132",
    "traceml-ai==0.3.6",
    "typer==0.26.8",
    "einops==0.8.2",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
    "pyiqa==0.1.16",
]

# RKNN conversion stays in a separate environment because rknn-toolkit2's
# PyTorch requirement conflicts with this project's pinned training stack.

[project.scripts]
rk3588-mobile-sr = "rk3588_mobile_sr.cli:main"
rk3588-train = "rk3588_mobile_sr.train.unified:main"
rk3588-export-onnx = "rk3588_mobile_sr.deploy.onnx:main"
rk3588-eval-psnr = "rk3588_mobile_sr.eval.psnr:evaluate_cli"
rk3588-convert-rknn = "rk3588_mobile_sr.deploy.rknn:main"
rk3588-bench-rknn-activations = "rk3588_mobile_sr.deploy.act_fusion_bench:main"
rk3588-build-rknn-calibration = "rk3588_mobile_sr.dev.build_mlvc_calibration:main"
rk3588-generate-report-charts = "rk3588_mobile_sr.dev.generate_report_charts:main"

[tool.uv]
add-bounds = "exact"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchcodec = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.extra-build-dependencies]
rk3588-mobile-sr = ["meson==1.12.0", "ninja==1.13.0"]

[build-system]
requires = ["hatchling==1.32.0", "meson==1.12.0", "ninja==1.13.0"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rk3588_mobile_sr"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
    "/hatch_build.py",
    "/scripts/setup_vmaf.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    "checkpoints",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
    "N812",  # torchvision TF / torch.nn.functional F aliases
    "N817",  # DistributedDataParallel as DDP
]

[tool.ruff.lint.pydocstyle]
convention = "google"
