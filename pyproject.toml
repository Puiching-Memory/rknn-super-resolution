[project]
name = "rk3588-mobile-sr"
version = "0.1.0"
description = "RK3588 MobileOne 3x SISR (360x640 -> 1080x1920) with CUDA 13.0 PyTorch training"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "onnx>=1.17",
    "nvidia-dali-cuda130>=2.1.0",
    "lmdb>=1.4",
    "loguru>=0.7",
    "lpips>=0.1.4",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scikit-image>=0.21",
    "swanlab>=0.5.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "traceml-ai>=0.3.1",
    "typer>=0.12.0",
    "torchsr>=1.0.4",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6.0",
]

# RKNN conversion is typically done in a separate environment because
# rknn-toolkit2 pins torch<=2.4.0, which conflicts with this project's
# torch>=2.12.0 requirement. Install it manually there when needed.

[project.scripts]
rk3588-mobile-sr = "rk3588_mobile_sr.cli:main"
rk3588-train-stage1 = "rk3588_mobile_sr.train.stage1:main"
rk3588-train-stage2 = "rk3588_mobile_sr.train.stage2:main"
rk3588-train-stage3-qat = "rk3588_mobile_sr.train.stage3_qat:main"
rk3588-build-div2k-lmdb = "rk3588_mobile_sr.data.div2k_lmdb:main"
rk3588-export-onnx = "rk3588_mobile_sr.export.onnx:main"
rk3588-eval-psnr = "rk3588_mobile_sr.eval.psnr:evaluate_cli"
rk3588-convert-rknn = "rk3588_mobile_sr.deploy.rknn:main"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
nvidia-dali-cuda130 = { index = "nvidia" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rk3588_mobile_sr"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    "checkpoints",
    "data/DIV2K_*",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
    "N812",  # torchvision TF / torch.nn.functional F aliases
    "N817",  # DistributedDataParallel as DDP
]

[tool.ruff.lint.pydocstyle]
convention = "google"
