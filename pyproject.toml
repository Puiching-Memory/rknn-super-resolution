[project]
name = "rknn-super-resolution"
version = "0.1.0"
description = "Rockchip RKNN frozen-MLVC codec-aware Phase-RLFN 3x super-resolution"
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "MIT" }
dependencies = [
    "numpy==2.5.2",
    "onnx==1.22.0",
    "onnxscript==0.7.1",
    "opencv-python-headless==4.11.0.86",
    "loguru==0.7.3",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "scikit-image==0.26.0",
    "swanlab==0.9.1",
    "torch==2.13.0+cu132",
    "torchao==0.18.0",
    "torchcodec==0.16.0+cu132",
    "traceml-ai==0.3.6",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

# RKNN conversion stays in a separate environment because rknn-toolkit2's
# PyTorch requirement conflicts with this project's pinned training stack.

[project.scripts]
rknn-super-resolution = "rknn_super_resolution.cli:main"
rknn-super-resolution-train = "rknn_super_resolution.train.unified:main"
rknn-super-resolution-export-onnx = "rknn_super_resolution.deploy.onnx:main"
rknn-super-resolution-eval-mlvc-checkpoint = "rknn_super_resolution.eval.mlvc_checkpoint:main"
rknn-super-resolution-convert-rknn = "rknn_super_resolution.deploy.rknn:main"
rknn-super-resolution-bench-rknn-activations = "rknn_super_resolution.deploy.act_fusion_bench:main"
rknn-super-resolution-build-rknn-calibration = "rknn_super_resolution.dev.build_mlvc_calibration:main"
rknn-super-resolution-sr-preview-report = "rknn_super_resolution.dev.sr_preview_report:main"
rknn-super-resolution-model-observatory = "rknn_super_resolution.dev.model_observatory:main"
rknn-super-resolution-cst-oracle = "rknn_super_resolution.dev.cst_oracle:main"
rknn-super-resolution-cst-oracle-summary = "rknn_super_resolution.dev.cst_oracle_summary:main"
rknn-super-resolution-cst-information-oracle = "rknn_super_resolution.dev.cst_information_oracle:main"
rknn-super-resolution-sparse-attention-bench = "rknn_super_resolution.deploy.sparse_attention_bench:main"
rknn-super-resolution-temporal-correlation-observatory = "rknn_super_resolution.dev.temporal_correlation_observatory:main"

[tool.uv]
add-bounds = "exact"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchcodec = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.extra-build-dependencies]
rknn-super-resolution = ["meson==1.12.0", "ninja==1.13.0"]

[build-system]
requires = ["hatchling==1.32.0", "meson==1.12.0", "ninja==1.13.0"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rknn_super_resolution"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
    "/hatch_build.py",
    "/scripts/setup_vmaf.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    "checkpoints",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
    "N812",  # torchvision TF / torch.nn.functional F aliases
    "N817",  # DistributedDataParallel as DDP
]

[tool.ruff.lint.pydocstyle]
convention = "google"
