[project]
name = "rk3588-mobile-sr"
version = "0.1.0"
description = "RK3588 MobileOne 3x SISR (360x640 -> 1080x1920) with CUDA 13.0 PyTorch training"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "onnx>=1.17",
    "nvidia-dali-cuda130>=2.1.0",
    "lmdb>=1.4",
    "lpips>=0.1.4",
    "pillow>=10.0",
    "pytest>=8.0",
    "rich>=13.0",
    "ruff>=0.6.0",
    "scikit-image>=0.21",
    "swanlab>=0.5.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "traceml-ai>=0.3.1",
]

# RKNN conversion is typically done in a separate environment because
# rknn-toolkit2 pins torch<=2.4.0, which conflicts with this project's
# torch>=2.12.0 requirement. Install it manually there when needed.

[project.scripts]
rk3588-train-stage1 = "train_stage1:main"
rk3588-build-div2k-lmdb = "data.div2k_lmdb:main"
rk3588-train-stage2 = "train_stage2:main"
rk3588-train-stage3-qat = "train_stage3_qat:main"
rk3588-export-onnx = "export_onnx:main"
rk3588-eval-psnr = "eval_psnr:evaluate"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
nvidia-dali-cuda130 = { index = "nvidia" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "train_stage1",
    "train_stage2",
    "train_stage3_qat",
    "export_onnx",
    "eval_psnr",
    "rknn_convert",
]
packages = ["data", "models", "losses", "configs", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "checkpoints",
    "data/DIV2K_*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long: handled by formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"
